# Build and Release Workflow for keeper-k8s-injector
#
# WORKFLOW LOGIC:
#   - Pull Request: test + lint (fast feedback)
#   - Push to main: test + lint + build images (validation)
#   - Tag push (v*): test + lint + build + push Docker images + GitHub Release
#
# PUBLISHED ARTIFACTS (on tag only):
#   - Docker: keeper/injector-webhook:X.Y.Z, keeper/injector-sidecar:X.Y.Z
#   - GitHub Release: with auto-generated release notes
#
# Helm chart is published separately from:
#   https://github.com/Keeper-Security/helm-charts
#
# REQUIRED SECRETS (in 'prod' environment):
#   - DOCKERHUB_USERNAME
#   - DOCKERHUB_TOKEN

name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

# Least privilege by default; the release job grants itself what it needs.
permissions:
  contents: read

env:
  GO_VERSION: "1.25.6"

jobs:
  # ========================================
  # TEST AND LINT (runs on all events)
  # ========================================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Clean Go cache
        run: go clean -modcache -cache -testcache

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: --timeout=5m

  # ========================================
  # BUILD IMAGES (runs on main and tags)
  # ========================================
  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [test, lint]
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build webhook image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.webhook
          push: false
          platforms: linux/amd64,linux/arm64
          tags: keeper/injector-webhook:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build sidecar image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.sidecar
          push: false
          platforms: linux/amd64,linux/arm64
          tags: keeper/injector-sidecar:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # RELEASE (runs on tag push only)
  # Publishes: Docker images + GitHub Release
  # Helm chart is managed in https://github.com/Keeper-Security/helm-charts
  # ========================================
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [test, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: prod
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version and build metadata
        id: version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Build and push Docker images
      - name: Build and push webhook image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.webhook
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            keeper/injector-webhook:${{ steps.version.outputs.VERSION }}
            keeper/injector-webhook:latest
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push sidecar image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.sidecar
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            keeper/injector-sidecar:${{ steps.version.outputs.VERSION }}
            keeper/injector-sidecar:latest
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
