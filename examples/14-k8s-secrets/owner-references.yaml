# Owner Reference Examples
# Controls the k8s-secret-owner-ref setting.
#
# IMPORTANT: The Secret is created during the pod's mutating-admission webhook, BEFORE the API
# server assigns the pod a UID. A Pod owner reference with an empty UID would be rejected, so even
# under the default `k8s-secret-owner-ref: "true"` NO owner reference is actually attached today.
# As a result, auto-cleanup-on-pod-delete via owner reference is NOT available: in BOTH cases below
# the created Secret persists after the pod is deleted, until you delete the Secret or its namespace.

---
# Default owner-ref setting (true), but note: no owner reference is attached at admission, so the
# Secret is NOT auto-deleted when the pod terminates — it persists.
apiVersion: v1
kind: Pod
metadata:
  name: auto-cleanup-demo
  annotations:
    keeper.security/inject: "true"
    keeper.security/ksm-config: "keeper-credentials"
    keeper.security/inject-as-k8s-secret: "true"
    keeper.security/k8s-secret-name: "ephemeral-secret"
    keeper.security/secret: "demo-secret"
    # keeper.security/k8s-secret-owner-ref: "true" (default, can omit)
spec:
  containers:
    - name: app
      image: nginx:alpine

---
# Explicitly opt out of owner-reference behavior.
# Secret persists after pod deletion (for shared secrets) — same observable result as the default
# today, since no owner reference is attached at admission either way.
apiVersion: v1
kind: Pod
metadata:
  name: persistent-secret-demo
  annotations:
    keeper.security/inject: "true"
    keeper.security/ksm-config: "keeper-credentials"
    keeper.security/inject-as-k8s-secret: "true"
    keeper.security/k8s-secret-name: "persistent-secret"
    keeper.security/k8s-secret-owner-ref: "false"
    keeper.security/secret: "demo-secret"
spec:
  containers:
    - name: app
      image: nginx:alpine

---
# Verification:
# 1. Deploy both pods: kubectl apply -f owner-references.yaml
# 2. Check Secrets: kubectl get secrets
# 3. Delete pods: kubectl delete pod auto-cleanup-demo persistent-secret-demo
# 4. Check Secrets again: kubectl get secrets
#    - ephemeral-secret: STILL EXISTS (no owner reference is attached at admission, so it is not
#      auto-deleted; delete it manually with `kubectl delete secret ephemeral-secret`)
#    - persistent-secret: EXISTS (no owner reference)
